<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SindiHoje</title>
<style>
  :root { color-scheme: light dark; --fundo: #F2F2F7; --texto: #1C1C1E; --sec: #6E6E73; --tint: #0F8F7F; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0A1C24; --texto: #FFFFFF; --sec: #A3B8BF; --tint: #1FB5A6; } }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--fundo);
         color: var(--texto); font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; padding: 24px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: var(--sec); line-height: 1.45; margin: 0 0 22px; }
  button { background: var(--tint); color: #fff; border: 0; border-radius: 999px; padding: 12px 28px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Sem conexão</h1>
  <p>Na primeira vez, o SindiHoje precisa da internet para se instalar. Depois disso, ele abre mesmo sem conexão.</p>
  <button onclick="location.href='https://sindihoje.expo.app/'">Tentar de novo</button>
</main>
</body>
</html>
